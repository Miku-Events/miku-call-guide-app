name: Bug report
description: Report a reproducible problem in the public application
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities, credentials, or private personal information here. Follow SECURITY.md instead.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence without sensitive data.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Affected route or URL
      placeholder: "https://miku.sekai.today/#/..."
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 000 on Windows 11"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or request IDs if useful. Remove tokens, cookies, and personal information first.
