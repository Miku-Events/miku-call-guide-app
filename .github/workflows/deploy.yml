name: Quality and production release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure frontend build
        shell: bash
        env:
          PRODUCTION_RELEASE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          PRODUCTION_APP_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          PRODUCTION_DATA_MANIFEST_URL: ${{ vars.VITE_DATA_MANIFEST_URL }}
          PRODUCTION_TURNSTILE_SITE_KEY: ${{ vars.VITE_CLOUDFLARE_TURNSTILE_SITE_KEY }}
        run: |
          echo "VITE_RELEASE_ID=$GITHUB_SHA" >> "$GITHUB_ENV"
          if [[ "$PRODUCTION_RELEASE" != "true" ]]; then
            {
              echo "VITE_APP_ORIGIN=http://127.0.0.1:4173"
              echo "VITE_DATA_MANIFEST_URL=https://example.test/manifest.json"
              echo "VITE_SUBMISSION_API_URL=http://127.0.0.1:4173"
              echo "VITE_CLOUDFLARE_TURNSTILE_SITE_KEY=1x00000000000000000000AA"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          node scripts/validate-production-build-env.mjs >> "$GITHUB_ENV"

      - name: Run quality checks and build
        run: npm run check

      - name: Build Pages Functions
        run: npm run check:functions

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Upload built app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Node 24 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install npm 11
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run Node 24 compatibility checks
        env:
          VITE_APP_ORIGIN: http://127.0.0.1:4173
          VITE_CLOUDFLARE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          VITE_DATA_MANIFEST_URL: https://example.test/manifest.json
          VITE_RELEASE_ID: node-24-${{ github.sha }}
          VITE_SUBMISSION_API_URL: http://127.0.0.1:4173
        run: |
          npm run check
          npm run check:functions

  e2e:
    name: Built-artifact E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E against built app
        run: npm run test:e2e:ci

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  preview:
    name: Deploy and browser-smoke enforced-CSP preview
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - quality
      - compatibility
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.preview.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download tested app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify enforced-CSP artifact
        shell: bash
        run: |
          test -f dist/index.html
          grep -q '^  Content-Security-Policy:' dist/_headers
          ! grep -q 'Content-Security-Policy-Report-Only:' dist/_headers

      - name: Publish enforced-CSP Pages preview
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.118.0
          command: pages deploy dist --project-name=miku-call-guide-app --branch=release-preview-${{ github.sha }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser-smoke enforced-CSP preview
        env:
          APP_SMOKE_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          DATA_MANIFEST_URL: ${{ vars.VITE_DATA_MANIFEST_URL }}
          EXPECTED_RELEASE_ID: ${{ github.sha }}
          PREVIEW_SMOKE_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: npm run smoke:preview

  deploy:
    name: Deploy production artifact
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.VITE_APP_ORIGIN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Download tested app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          digest-mismatch: error

      - name: Verify artifact
        shell: bash
        run: |
          test -f dist/index.html
          grep -q '^  Content-Security-Policy:' dist/_headers
          ! grep -q 'Content-Security-Policy-Report-Only:' dist/_headers

      - name: Publish to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PRODUCTION_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.118.0
          command: pages deploy dist --project-name=miku-call-guide-app --branch=main

      - name: Smoke deployed app and data
        env:
          APP_SMOKE_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          DATA_MANIFEST_URL: ${{ vars.VITE_DATA_MANIFEST_URL }}
          DEPLOYMENT_SMOKE_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_RELEASE_ID: ${{ github.sha }}
        run: npm run smoke:deploy

      - name: Install production-smoke Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser-smoke custom production origin
        env:
          APP_SMOKE_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          BROWSER_SMOKE_ORIGIN: ${{ vars.VITE_APP_ORIGIN }}
          DATA_MANIFEST_URL: ${{ vars.VITE_DATA_MANIFEST_URL }}
          EXPECTED_RELEASE_ID: ${{ github.sha }}
        run: npm run smoke:browser
